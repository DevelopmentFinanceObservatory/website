name: Deploy production

# Builds, migrates and deploys production on every push to main, and on a
# manual dispatch from main to redeploy. The steps live in
# build-migrate-deploy.yml, the same ones deploy.yml runs on dev, here
# against the `production` GitHub Environment. That environment restricts
# deploys to main and requires approval from the release reviewers.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production-website
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-migrate-deploy.yml
    # A called workflow sees no secrets, its environment's included, without this.
    secrets: inherit
    with:
      environment: production
